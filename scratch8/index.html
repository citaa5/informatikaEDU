<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Filip Cihlář">
<title>Scratch – dnešní hodina · 8. ročník</title>
<style>
:root{--navy:#1A2D5C;--red:#C8102E;--green:#2e7d32;--line:#d5d9e2;--bg:#f4f6fa}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:#1d1d1f;font-family:"Segoe UI",Calibri,Arial,sans-serif;font-size:18px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .t{font-weight:700;font-size:19px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:14px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.15)}
.steps span.on{background:#FFBF00;color:#1d1d1f;font-weight:700}
.steps span.ok{background:#4caf50}
main{max-width:1060px;margin:0 auto;padding:18px 20px 110px}
h1{color:var(--navy);font-size:30px;margin:4px 0 6px}
h2{color:var(--navy);font-size:22px;margin:16px 0 6px}
.lead{font-size:20px;color:#333;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:0 0 14px}
.min{display:inline-block;background:#eef1f8;color:var(--navy);font-size:14px;font-weight:700;border-radius:10px;padding:2px 10px;margin-bottom:6px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:10px 18px;font-weight:700}
.btn{background:var(--navy);color:#fff}
.btn.big{font-size:20px;padding:12px 26px}
.btn.green{background:#2e9e44}
.btn.ghost{background:#e9ecf3;color:var(--navy)}
.btn.flag{background:#4CAF50;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(46,158,68,.25)}}
/* bloky */
.blk{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;min-height:34px;border-radius:7px;font-weight:600;font-size:16px;border:1px solid rgba(0,0,0,.18);white-space:nowrap;user-select:none}
.blk.hat{border-radius:22px 22px 7px 7px;padding-top:10px}
.inp{background:#fff;color:#333;border-radius:11px;padding:0 8px;font-weight:600;min-width:22px;text-align:center}
.chip{display:inline-block;border-radius:6px;padding:0 7px;font-size:16px;font-weight:600;line-height:1.55;white-space:nowrap}
/* skládačka */
.puzzle{display:grid;grid-template-columns:300px 1fr 400px;gap:14px;align-items:start}
@media (max-width:1000px){.puzzle{grid-template-columns:1fr 1fr}.puzzle .stagebox{grid-column:1/3}}
.pal,.ws{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:300px}
.pal h3,.ws h3{margin:0 0 8px;font-size:15px;color:#555;font-weight:600}
.pal .blk{display:flex;width:max-content;margin:0 0 8px;cursor:pointer}
.pal .blk:hover{filter:brightness(1.08);transform:translateX(3px)}
.pal .gone{visibility:hidden;height:0;margin:0;padding:0;min-height:0;border:0}
.ws{background:#f9fafc;background-image:radial-gradient(#dfe3ea 1px,transparent 1px);background-size:18px 18px}
.ws .blk{cursor:pointer}
.ws .blk:hover{outline:2px solid #c62828}
.slot{height:12px;width:220px;margin:2px 0;border-radius:4px;cursor:pointer;border:1px dashed #cfd5e0}
.slot:hover{background:#cfd8ea}
.slot.on{height:30px;border:2px dashed #2e9e44;background:#eaf7ec;color:#2e7d32;font-size:14px;font-weight:700;display:flex;align-items:center;padding-left:8px;width:220px}
.cb{display:inline-block}
.cb .ctop{border-radius:7px 7px 0 0}
.cb .cin{border-left:18px solid;margin-left:0;padding:3px 0 3px 6px;min-height:30px}
.cb .cbot{height:16px;width:150px;border-radius:0 0 7px 7px;border:1px solid rgba(0,0,0,.18);border-top:0}
.stagebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.stagebar{display:flex;gap:8px;margin-bottom:8px;align-items:center}
canvas{width:100%;border:1px solid #c9ced8;border-radius:6px;background:#fff;display:block}
.msg{margin-top:10px;padding:10px 14px;border-radius:10px;font-weight:600;display:none}
.msg.bad{display:block;background:#fdecea;color:#b71c1c}
.msg.good{display:block;background:#e8f5e9;color:#1b5e20}
.msg.info{display:block;background:#eef1f8;color:var(--navy)}
.help{font-size:15px;color:#555;margin:6px 0 0}
/* kvíz */
.q{margin-bottom:16px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.opt{background:#fff;border:2px solid var(--line);color:#1d1d1f;font-weight:600;padding:10px 16px}
.opt:hover{border-color:var(--navy)}
.opt.right{border-color:#2e9e44;background:#e8f5e9}
.opt.wrong{border-color:#c62828;background:#fdecea}
.exp{margin-top:8px;font-weight:600;display:none}
.script{display:inline-flex;flex-direction:column;gap:3px;background:#f9fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:6px}
/* úlohy */
.uh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hv{color:#FFAB19;font-size:22px;letter-spacing:2px}.hv span{color:#ddd}
ol.kroky{margin:6px 0 8px 22px;padding:0}
ol.kroky li{margin:6px 0;line-height:1.7}
.ok b{color:var(--green)}.bonus b{color:var(--red)}
.tip{background:#fff8e1;border-left:5px solid #FFBF00;padding:8px 12px;border-radius:6px;margin:10px 0;display:none}
.sol{background:#f9fafc;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;display:none}
.sol .r{margin:3px 0}
.sol .note{color:var(--red);font-weight:600;margin-top:4px}
.donebox{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.donebox label{font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.donebox input{width:22px;height:22px}
.wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.wrap ol{flex:1;min-width:380px}
.summary{font-size:22px;font-weight:700;color:var(--navy);background:#eef1f8;border-radius:10px;padding:12px 16px;display:inline-block}
.num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;align-items:center;justify-content:center;margin-right:8px;flex:none}
.li{display:flex;align-items:flex-start;margin:8px 0}
.kat{display:inline-block;font-size:13px;font-weight:700;border-radius:10px;padding:1px 8px;margin-right:4px}
</style>
</head>
<body>
<header><div class="t">Scratch · 8. ročník</div><div class="steps" id="steps"></div></header>
<main id="main"></main>
<nav class="bottom">
  <button class="btn ghost" id="prev">← Zpět</button>
  <span id="pos" style="color:#777;font-size:15px"></span>
  <button class="btn big" id="next">Další →</button>
</nav>

<script>
"use strict";
/* ---------- barvy kategorií (Scratch 3) ---------- */
const KAT = {udalosti:["Události","#FFBF00","#1d1d1f"], pohyb:["Pohyb","#4C97FF","#fff"], vzhled:["Vzhled","#9966FF","#fff"],
  ovladani:["Ovládání","#FFAB19","#1d1d1f"], vnimani:["Vnímání","#5CB1D6","#fff"], operatory:["Operátory","#59C059","#fff"],
  promenne:["Proměnné","#FF8C1A","#fff"], pero:["Pero","#0FBD8C","#fff"]};

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function label(t){ return esc(t).replace(/\[([^\]]*)\]/g,'<span class="inp">$1</span>')
  .replace(/⟨([^⟩]*)⟩/g,'<span class="inp" style="background:#5CB1D6;color:#fff;border:2px solid #fff;border-radius:4px;padding:0 10px">$1</span>'); }
function blkHTML(b, extra=""){ const [,bg,fg]=KAT[b.kat];
  return `<div class="blk${b.op==="hat"?" hat":""}" style="background:${bg};color:${fg}" ${extra}>${label(b.t)}</div>`; }
function chip(kat, t){ const [,bg,fg]=KAT[kat]; return `<span class="chip" style="background:${bg};color:${fg}">${esc(t)}</span>`; }
function md(s){ return s.replace(/\{(\w+):([^}]*)\}/g,(m,k,t)=>chip(k,t)); }

/* ---------- uložený postup ---------- */
const KEY="scratch8d-v2-"+location.pathname;
let S = {screen:0, done:{}, bonus:{}, solved:{}};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- mini scéna (souřadnice jako ve Scratchi: 480 × 360, střed 0,0) ---------- */
class Stage{
  constructor(canvas, init){ this.c=canvas; this.g=canvas.getContext("2d"); this.init=init; this.reset(); }
  reset(){ const i=this.init; this.x=i.x; this.y=i.y; this.dir=i.dir; this.pen=false; this.lines=(i.lines||[]).map(l=>l.slice());
    this.bubble=null; this.stopFlag=true; this.warn=false; this.draw(); }
  edge(){ return Math.abs(this.x)+24>=240 || Math.abs(this.y)+24>=180; }
  px(x){return x+240} py(y){return 180-y}
  draw(){ const g=this.g; g.clearRect(0,0,480,360);
    g.strokeStyle="#eef0f4"; g.lineWidth=1; g.beginPath(); g.moveTo(240,0); g.lineTo(240,360); g.moveTo(0,180); g.lineTo(480,180); g.stroke();
    g.fillStyle="#b0b6c3"; g.font="12px Segoe UI"; g.fillText("0, 0",244,176);
    g.strokeStyle="#1f6fe5"; g.lineWidth=4; g.lineCap="round";
    for(const [a,b,c,d] of this.lines){ g.beginPath(); g.moveTo(this.px(a),this.py(b)); g.lineTo(this.px(c),this.py(d)); g.stroke(); }
    g.save(); g.translate(this.px(this.x),this.py(this.y)); g.rotate((this.dir-90)*Math.PI/180);
    g.font="44px 'Segoe UI Emoji','Apple Color Emoji',sans-serif"; g.textAlign="center"; g.textBaseline="middle"; g.fillText("🐱",0,0);
    g.restore();
    if(this.bubble){ const bx=this.px(this.x)+18, by=this.py(this.y)-58; g.font="bold 18px Segoe UI"; const w=g.measureText(this.bubble).width+24;
      g.fillStyle="#fff"; g.strokeStyle="#888"; g.lineWidth=2; g.beginPath(); g.roundRect(bx,by,w,36,14); g.fill(); g.stroke();
      g.fillStyle="#333"; g.textAlign="left"; g.textBaseline="middle"; g.fillText(this.bubble,bx+12,by+18); }
  }
  sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  async move(n){ const r=this.dir*Math.PI/180, x0=this.x, y0=this.y, x1=x0+n*Math.sin(r), y1=y0+n*Math.cos(r);
    let L=null; if(this.pen){ L=[x0,y0,x0,y0]; this.lines.push(L); }
    const steps=Math.max(8,Math.round(Math.abs(n)/8));
    for(let k=1;k<=steps;k++){ if(this.stopFlag) return; this.x=x0+(x1-x0)*k/steps; this.y=y0+(y1-y0)*k/steps; if(L){L[2]=this.x;L[3]=this.y;} this.draw(); await this.sleep(22); }
    this.x=Math.round(x1); this.y=Math.round(y1); if(L){L[2]=this.x;L[3]=this.y;} this.draw(); }
  async turn(d){ const d0=this.dir; for(let k=1;k<=8;k++){ if(this.stopFlag) return; this.dir=d0+d*k/8; this.draw(); await this.sleep(25);} this.dir=((d0+d)%360+360)%360; this.draw(); }
  async exec(list){ for(const b of list){ if(this.stopFlag) return; await this.step(b); } }
  async step(b){ const a=b.a||[];
    switch(b.op){
      case "hat": break;
      case "goto": if(this.pen) this.lines.push([this.x,this.y,a[0],a[1]]); this.x=a[0]; this.y=a[1]; this.draw(); await this.sleep(150); break;
      case "dir": this.dir=a[0]; this.draw(); await this.sleep(150); break;
      case "say": this.bubble=a[0]; this.draw(); await this.sleep(a[1]*1000); this.bubble=null; this.draw(); break;
      case "move": await this.move(a[0]); break;
      case "turn": await this.turn(a[0]); break;
      case "wait": await this.sleep(a[0]*1000); break;
      case "clear": this.lines=[]; this.draw(); await this.sleep(150); break;
      case "pendown": this.pen=true; break;
      case "penup": this.pen=false; break;
      case "repeat": for(let i=0;i<a[0];i++){ if(this.stopFlag) return; await this.exec(b.kids||[]); } break;
      case "until": { let n=0; while(!this.edge()){ if(this.stopFlag) return; if(++n>150){ this.warn=true; return; } await this.exec(b.kids||[]); await this.sleep(16); } break; }
    }
  }
}

/* ---------- skládačky ---------- */
const PUZ = {
  s0: { title:"Kočka řekne Ahoj", min:"spojovačka 1 · rozcvička · asi 2 minuty",
    zad:"Poskládej program: po kliknutí na zelenou vlajku kočka řekne „Ahoj!“ a pak popojde dopředu.",
    how:true,
    hints:["Program vždycky začíná žlutým blokem s vlajkou. Ten dej první.","Kočka nejdřív mluví a teprve potom jde. Bublina je tedy druhá.","Pořadí: po kliknutí na ⚑ → bublina Ahoj! → dopředu o 100 kroků."],
    init:{x:-120,y:0,dir:90},
    blocks:{ h:{kat:"udalosti",t:"po kliknutí na ⚑",op:"hat"}, s:{kat:"vzhled",t:"bublina [Ahoj!] [2] sekund",op:"say",a:["Ahoj!",2]},
      m:{kat:"pohyb",t:"dopředu o [100] kroků",op:"move",a:[100]} },
    order:["m","h","s"],
    check(tree){ const ids=tree.map(n=>n.id);
      if(ids.length<3) return `Ve skriptu máš ${ids.length} ze 3 bloků. Klikni i na ty, které zůstaly vlevo.`;
      if(ids[0]!=="h") return "Nahoře musí být žlutý blok „po kliknutí na ⚑“. Bez něj kočka neví, kdy začít.";
      if(ids.join()!=="h,s,m") return "Kočka má nejdřív pozdravit a pak jít. Prohoď bublinu a „dopředu“.";
      return true; } },
  a1: { title:"Kočka se představí", min:"spojovačka 2 · asi 3 minuty",
    zad:"Kočka skočí na start vlevo, řekne „Ahoj!“, přejde doprava, chvilku počká a couvne zpátky na start.",
    hints:["Nahoře je žlutý blok po kliknutí na ⚑.","Pak kočku postav na start: skoč na x: -150 y: 0 a nastav směr 90 (= kouká doprava). Proto začne vždycky vlevo, ať stojí kdekoli.",
      "Potom bublina Ahoj!, dopředu o 150 kroků a čekej 1 sekund.","Úplně dole je dopředu o -150 kroků. Mínus znamená couvni zpátky."],
    init:{x:60,y:-90,dir:0},
    blocks:{ h:{kat:"udalosti",t:"po kliknutí na ⚑",op:"hat"}, g:{kat:"pohyb",t:"skoč na x: [-150] y: [0]",op:"goto",a:[-150,0]},
      d:{kat:"pohyb",t:"nastav směr [90]",op:"dir",a:[90]}, s:{kat:"vzhled",t:"bublina [Ahoj!] [2] sekund",op:"say",a:["Ahoj!",2]},
      m1:{kat:"pohyb",t:"dopředu o [150] kroků",op:"move",a:[150]}, w:{kat:"ovladani",t:"čekej [1] sekund",op:"wait",a:[1]},
      m2:{kat:"pohyb",t:"dopředu o [-150] kroků",op:"move",a:[-150]} },
    order:["m2","s","h","w","d","m1","g"],
    check(tree){ const ids=tree.map(n=>n.id); const v=[["h","g","d","s","m1","w","m2"],["h","d","g","s","m1","w","m2"]];
      if(ids.length<7) return `Ve skriptu máš ${ids.length} ze 7 bloků. Přidej i ty ostatní.`;
      if(ids[0]!=="h") return "Skript musí začínat žlutým blokem „po kliknutí na ⚑“. Bez něj kočka neví, kdy začít.";
      if(v.some(x=>x.join()===ids.join())) return true;
      let best=0; for(const x of v){ let i=0; while(i<7&&x[i]===ids[i]) i++; best=Math.max(best,i); }
      return `${best===1?"Blok č. 1 je":`Bloky č. 1 až ${best} jsou`} dobře, blok č. ${best+1} sem nepatří. Spusť vlajku a sleduj, kdy kočka udělá něco jinak než v zadání.`; } },
  a2: { title:"Čtverec perem", min:"spojovačka 3 · asi 3 minuty",
    zad:"Kočka nejdřív smaže starou čmáranici a pak nakreslí čtverec.<br><small>Opakování obejme bloky, které do něj přidáš. Až budeš chtít pokračovat <b>pod</b> opakováním, klikni na čárkovaný řádek pod oranžovou čelistí.</small>",
    hints:["Začátek: po kliknutí na ⚑, smaž, skoč na x: 0 y: 0, nastav směr 90.","Pak pero zapni – od té chvíle kočka za sebou kreslí čáru.",
      "Opakuj 4 krát a do něj dopředu o 100 kroků a otoč se o 90 stupňů. Čtverec má 4 strany a 4 rohy.","Pod opakování (klikni na čárkovaný řádek pod oranžovou čelistí) dej pero vypni."],
    init:{x:-140,y:70,dir:90,lines:[[-210,-120,-60,-150],[-60,-150,-20,-100]]},
    blocks:{ h:{kat:"udalosti",t:"po kliknutí na ⚑",op:"hat"}, c:{kat:"pero",t:"smaž",op:"clear"}, g:{kat:"pohyb",t:"skoč na x: [0] y: [0]",op:"goto",a:[0,0]},
      d:{kat:"pohyb",t:"nastav směr [90]",op:"dir",a:[90]}, pd:{kat:"pero",t:"pero zapni",op:"pendown"},
      r:{kat:"ovladani",t:"opakuj [4] krát",op:"repeat",a:[4],c:true}, f:{kat:"pohyb",t:"dopředu o [100] kroků",op:"move",a:[100]},
      t:{kat:"pohyb",t:"otoč se ↻ o [90] stupňů",op:"turn",a:[90]}, pu:{kat:"pero",t:"pero vypni",op:"penup"} },
    order:["f","pu","r","h","t","g","pd","c","d"],
    check(tree){ const all=[]; (function walk(L){for(const n of L){all.push(n.id); if(n.kids) walk(n.kids);}})(tree);
      if(all.length<9) return `Ve skriptu máš ${all.length} z 9 bloků. Přidej i ty ostatní.`;
      if(tree[0].id!=="h") return "Skript musí začínat žlutým blokem „po kliknutí na ⚑“.";
      const top=tree.map(n=>n.id), r=tree.find(n=>n.id==="r");
      if(!r) return "Opakování musí být ve skriptu samo, ne schované uvnitř jiného bloku.";
      const inside=r.kids.map(n=>n.id).sort().join();
      if(inside!=="f,t") return "Do opakování patří přesně dva bloky: „dopředu o 100 kroků“ a „otoč se o 90 stupňů“. Ostatní dej mimo opakování.";
      const iR=top.indexOf("r"), iPd=top.indexOf("pd"), iPu=top.indexOf("pu");
      if(iPd>iR) return "Pero zapni ještě před opakováním – jinak se čtverec nenakreslí celý.";
      if(iPu<iR) return "Pero vypni až za opakováním, když je čtverec hotový.";
      if(top.indexOf("g")>iPd||top.indexOf("d")>iPd) return "Kočku nejdřív postav na start (skoč na x: 0 y: 0, nastav směr) a teprve pak zapni pero. Jinak nakreslí čáru navíc.";
      if(top.indexOf("c")>iPd) return "„Smaž“ dej před „pero zapni“ – jinak smažeš i kus nového čtverce.";
      return true; } },
  a3: { title:"Příklad: kočka ke kraji", min:"opakuj dokud · příklad · asi 4 minuty",
    zad:"Kočka jde doprava tak dlouho, dokud nenarazí na okraj scény. Pak řekne „Jsem na kraji!“. Nevíme, kolik kroků to bude – proto ne „opakuj 10 krát“, ale <b>opakuj dokud nenastane</b>.",
    hints:["Nahoře po kliknutí na ⚑, pak skoč na x: -180 y: 0 a nastav směr 90.","Pak opakuj dokud nenastane ⟨dotýkáš se okraje?⟩.",
      "Do opakování dej jen dopředu o 10 kroků. Kočka jde po malých krocích a po každém se zeptá: už jsem u okraje?","Pod opakování dej bublinu Jsem na kraji!"],
    init:{x:100,y:-100,dir:0},
    blocks:{ h:{kat:"udalosti",t:"po kliknutí na ⚑",op:"hat"}, g:{kat:"pohyb",t:"skoč na x: [-180] y: [0]",op:"goto",a:[-180,0]},
      d:{kat:"pohyb",t:"nastav směr [90]",op:"dir",a:[90]}, u:{kat:"ovladani",t:"opakuj dokud nenastane ⟨dotýkáš se okraje?⟩",op:"until",c:true},
      f:{kat:"pohyb",t:"dopředu o [10] kroků",op:"move",a:[10]}, s:{kat:"vzhled",t:"bublina [Jsem na kraji!] [2] sekund",op:"say",a:["Jsem na kraji!",2]} },
    order:["s","f","h","u","d","g"],
    check(tree){ const all=[]; (function walk(L){for(const n of L){all.push(n.id); if(n.kids) walk(n.kids);}})(tree);
      if(all.length<6) return `Ve skriptu máš ${all.length} z 6 bloků. Přidej i ty ostatní.`;
      if(tree[0].id!=="h") return "Skript musí začínat žlutým blokem „po kliknutí na ⚑“.";
      const top=tree.map(n=>n.id), u=tree.find(n=>n.id==="u");
      if(!u) return "Opakování musí být ve skriptu samo, ne schované uvnitř jiného bloku.";
      if(u.kids.map(n=>n.id).join()!=="f") return "Do opakování patří jen „dopředu o 10 kroků“. Kočka udělá krok, podívá se, jestli už je u okraje, a když ne, udělá další.";
      if(top.indexOf("g")>top.indexOf("u")||top.indexOf("d")>top.indexOf("u")) return "Nejdřív kočku postav na start a natoč doprava, teprve potom opakuj.";
      if(top.indexOf("s")<top.indexOf("u")) return "Bublina patří pod opakování – kočka má promluvit, až dojde k okraji.";
      return true; } }
};

function Puzzle(key){
  const P=PUZ[key]; let tree=[], used=new Set(), act={path:[],i:0}, stage=null;
  function listAt(path){ let L=tree; for(const i of path) L=L[i].kids; return L; }
  function render(){
    const pal=P.order.map(id=>{ const b=P.blocks[id];
      return used.has(id)?`<div class="blk gone"></div>`:blkHTML(b,`data-pal="${id}" title="Klikni – blok se přidá na místo ▶"`); }).join("");
    $("#pal").innerHTML=`<h3>Bloky – klikni a přidá se na zelené místo</h3>${pal||'<p class="help">Všechny bloky jsou ve skriptu.</p>'}`;
    $("#ws").innerHTML=`<h3>Skript – klikni na blok a vrátí se zpátky · klikni mezi bloky a změníš zelené místo</h3>`+list([],tree);
  }
  function slot(path,i){ const on=act.path.join()===path.join()&&act.i===i;
    return `<div class="slot${on?" on":""}" data-slot="${path.join(".")}|${i}">${on?"▶ sem přijde další blok":""}</div>`; }
  function list(path,L){ let h=""; L.forEach((n,i)=>{ h+=slot(path,i); h+=node(path.concat(i),n); }); return h+slot(path,L.length); }
  function node(path,n){ const b=P.blocks[n.id];
    if(!b.c) return `<div>${blkHTML(b,`data-ws="${path.join(".")}" title="Klikni – vrátit zpět"`)}</div>`;
    const [,bg,fg]=KAT[b.kat];
    return `<div class="cb"><div class="blk ctop" style="background:${bg};color:${fg}" data-ws="${path.join(".")}" title="Klikni – vrátit zpět">${label(b.t)}</div>
      <div class="cin" style="border-color:${bg}">${list(path,n.kids)}</div><div class="cbot" style="background:${bg}"></div></div>`;
  }
  function add(id){ if(stage) stage.stopFlag=true; const L=listAt(act.path); const n={id}; if(P.blocks[id].c) n.kids=[];
    L.splice(act.i,0,n); used.add(id);
    act = n.kids ? {path:act.path.concat(act.i),i:0} : {path:act.path,i:act.i+1}; msg(); render(); }
  function remove(pathStr){ if(stage) stage.stopFlag=true; const p=pathStr.split(".").map(Number), i=p.pop(), L=listAt(p);
    const [n]=L.splice(i,1); (function back(x){used.delete(x.id); (x.kids||[]).forEach(back);})(n);
    act={path:[],i:tree.length}; msg(); render(); }
  function msg(cls,t){ const m=$("#msg"); m.className="msg"+(cls?" "+cls:""); m.innerHTML=t||""; }
  function toBlocks(L){ return L.map(n=>Object.assign({},P.blocks[n.id],{kids:n.kids?toBlocks(n.kids):undefined})); }
  async function run(){
    if(!tree.length){ msg("info","Skript je prázdný. Nejdřív přidej bloky."); return; }
    stage.stopFlag=true; await stage.sleep(60); stage.reset();
    if(tree[0].id!=="h"){ msg("bad","Kočka nic neudělá. Skript se spustí vlajkou jen tehdy, když nahoře je žlutý blok „po kliknutí na ⚑“."); return; }
    stage.stopFlag=false; $("#run").disabled=true; await stage.exec(toBlocks(tree)); stage.stopFlag=true; $("#run").disabled=false;
    if(stage.warn) msg("bad","Opakování se točí pořád dokola a nikdy neskončí: kočka se uvnitř opakování nehýbe, takže k okraji nikdy nedojde.");
  }
  function check(){ const r=P.check(tree);
    if(r===true){ S.solved[key]=true; save(); msg("good","Správně! Klikni na zelenou vlajku a podívej se, jak to kočka udělá. Pak pokračuj tlačítkem Další."); $("#next").classList.add("pulse"); run(); }
    else msg("bad",r); }
  const how=P.how?`<div class="card" style="border-left:6px solid #2e9e44;padding:10px 16px"><b>Jak na to:</b> ① klikni na blok vlevo – přesune se doprostřed do skriptu · ② spletl(a) ses? klikni na blok ve skriptu a vrátí se · ③ klikni na <b>⚑ Spustit</b>, dívej se na kočku a pak klikni na <b>Zkontrolovat</b>.</div>`:"";
  const hints=P.hints?`<div style="margin:0 0 12px"><button class="btn ghost" id="hb">💡 Nápověda</button><ol id="hl" style="margin:8px 0 0 22px;padding:0"></ol></div>`:"";
  return { html:`<div class="min">${P.min||"spojovačka · asi 3 minuty"}</div><h1>${P.title}</h1><p class="lead">${P.zad}</p>${how}${hints}
      <div class="puzzle"><div class="pal" id="pal"></div><div class="ws" id="ws"></div>
      <div class="stagebox"><div class="stagebar"><button class="btn flag" id="run">⚑ Spustit</button><button class="btn ghost" id="stop">⏹</button>
      <button class="btn green" id="chk">Zkontrolovat</button><button class="btn ghost" id="rst" title="Začít znovu">↺</button></div>
      <canvas id="cv" width="480" height="360"></canvas><div class="msg" id="msg"></div>
      <p class="help">Šedé čáry se kříží uprostřed scény, v bodě x: 0, y: 0.</p></div></div>`,
    mount(){ stage=new Stage($("#cv"),P.init); render();
      if(P.hints){ let hi=0; $("#hb").onclick=()=>{ if(hi>=P.hints.length) return; const li=document.createElement("li"); li.style.margin="4px 0"; li.innerHTML=label(P.hints[hi]); $("#hl").appendChild(li); hi++;
        $("#hb").textContent = hi<P.hints.length ? `💡 Další nápověda (${hi}/${P.hints.length})` : "💡 Víc nápověd není"; $("#hb").disabled = hi>=P.hints.length; }; }
      $("#pal").onclick=e=>{ const t=e.target.closest("[data-pal]"); if(t) add(t.dataset.pal); };
      $("#ws").onclick=e=>{ const b=e.target.closest("[data-ws]"); if(b){ remove(b.dataset.ws); return; }
        const s=e.target.closest("[data-slot]"); if(s){ const [p,i]=s.dataset.slot.split("|"); act={path:p?p.split(".").map(Number):[],i:+i}; render(); } };
      $("#run").onclick=run; $("#stop").onclick=()=>{stage.stopFlag=true; $("#run").disabled=false;};
      $("#chk").onclick=check; $("#rst").onclick=()=>{ stage.stopFlag=true; tree=[]; used.clear(); act={path:[],i:0}; stage.reset(); msg(); render(); };
      if(S.solved[key]) msg("info","Tuhle skládačku už máš vyřešenou. Můžeš ji zkusit znovu, nebo jít dál."); },
    unmount(){ if(stage) stage.stopFlag=true; } };
}

function Dokud(){

    {q:`Baterie začne na <b>100</b>. Kolikrát se provedou bloky uvnitř opakování?`, o:["0krát","1krát","pořád dokola"], ok:0,
     e:"Scratch se zeptá dřív, než začne kolo. Podmínka platí hned, takže bloky uvnitř přeskočí a rovnou řekne Nabito!"}];

    kolo++; const nb=bat+20;

        <div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn" id="krok">Další kolo ▶</button><button class="btn ghost" id="znovu">↺ Znovu</button></div>
        <table style="width:100%;border-collapse:collapse;font-size:16px"><thead><tr style="text-align:left;border-bottom:2px solid #ccc"><th>kolo</th><th>baterie</th><th>= 100?</th><th>co se stane</th></tr></thead><tbody id="tb"></tbody></table>
        <div class="msg" id="dmsg"></div></div></div>
    <h2>Zkus to</h2>`+DQ.map((x,i)=>`<div class="card q"><div><b>${i+1}.</b> ${x.q}</div>

    unmount(){ $("#main").onclick=null; } }; }

function diagram(kind){

  const oval=(x,y,t)=>`<rect x="${x-50}" y="${y-14}" width="100" height="28" rx="14" fill="#fff" stroke="#333" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="14" font-weight="700">${t}</text>`;
  const dia=(x,y,t)=>`<polygon points="${x},${y-28} ${x+75},${y} ${x},${y+28} ${x-75},${y}" fill="#fff" stroke="#333" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" font-weight="700">${t}</text>`;
  const ar=p=>`<polyline points="${p}" fill="none" stroke="#333" stroke-width="2" marker-end="url(#m)"/>`;
  const lab=(x,y,t)=>`<text x="${x}" y="${y}" font-size="13" font-weight="700" fill="#444">${t}</text>`;
  const head=`<svg viewBox="0 0 360 340" style="width:300px" xmlns="http://www.w3.org/2000/svg"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>`;
  if(kind==="hadani") return head+oval(110,22,"START")+ar("110,36 110,53")+box(110,70,170,"Myslím si číslo")+ar("110,87 110,108")+box(110,125,170,"Zeptám se")
    +ar("110,142 110,167")+dia(110,195,"Uhodl?")+ar("185,195 245,195")+lab(189,188,"ne")+box(300,195,110,"Řeknu Vedle!")+ar("300,178 300,125 197,125")

  return head+oval(110,22,"START")+ar("110,36 110,53")+box(115,70,210,"Napustím a zapnu konvici")+ar("110,87 110,167")+dia(110,195,"Vře voda?")+ar("185,195 245,195")

  <div class="card">${LI(1,"Napiš své příjmení (stejně jako u části 1):")}${nameBox()}
  ${LI(2,"Ve Scratchi nahoře klikni na <b>Soubor → Uložit do svého počítače</b>.")}
  ${LI(3,`Objeví se okno s názvem? Napiš ${fn(3)} a klikni na <b>Uložit</b>.<br>Stáhl se soubor sám jako <i>Projekt Scratch.sb3</i>? V Chrome stiskni <b>Ctrl + J</b> → <b>Zobrazit ve složce</b>, soubor označ, stiskni <b>F2</b> a přepiš název na ${fn(3)}.`)}
  ${LI(4,`V Google učebně otevři úkol <b>3 Scratch</b> → <b>Přidat nebo vytvořit → Soubor</b> → vyber ${fn(3,".sb3")}.`)}
  ${LI(5,"Do <b>soukromého komentáře</b> opiš, kam jsi došel (došla):")}
  <div style="margin:4px 0 10px 38px"><span class="summary">${sum}</span></div>
  ${LI(6,"Klikni na <b>Odevzdat</b>.")}</div>
  <p class="help">Zbývá čas? Vrať se k úloze, kterou jsi nedodělal(a), nebo zkus bonus. Tlačítkem Zpět se dostaneš ke každé úloze.</p>`; }, mount(){ mountName(); } };

/* ---------- obrazovky ---------- */
const PLAN={
  ukazky:{secs:["Start","A · Spojovačky","B · Opakuj dokud","Odevzdání 1","Část 2 · Umíme to"], screens:[
    {sec:0,make:()=>IntroUkazky},
    {sec:1,make:()=>Puzzle("s0")},{sec:1,make:()=>Puzzle("a1")},{sec:1,make:()=>Puzzle("a2")},
    {sec:2,make:Dokud},{sec:2,make:()=>Puzzle("a3")},
    {sec:3,make:()=>Odevzdej1},{sec:4,make:()=>Umime2}]},
  ulohy:{secs:["Start","A · Jak na Scratch","B · Úlohy","C · Odevzdání"], screens:[
    {sec:0,make:()=>IntroUlohy},
    {sec:1,make:()=>({html:HOW[0].html(),mount(){}})},{sec:1,make:()=>({html:HOW[1].html(),mount(){}})},{sec:1,make:()=>({html:HOW[2].html(),mount(){}})},
    {sec:2,make:()=>Task(0)},{sec:2,make:()=>Task(1)},{sec:2,make:()=>Task(2)},{sec:2,make:()=>Task(3)},
    {sec:3,make:()=>End}]}
};
const SCREENS=PLAN[CAST].screens, SECS=PLAN[CAST].secs;
let cur=null;
function show(i){ if(cur&&cur.unmount) cur.unmount(); S.screen=Math.max(0,Math.min(SCREENS.length-1,i)); save();
  const sc=SCREENS[S.screen]; cur=sc.make(); $("#main").innerHTML=cur.html; cur.mount&&cur.mount();
  $("#steps").innerHTML=SECS.map((s,k)=>`<span class="${k===sc.sec?"on":(k<sc.sec?"ok":"")}">${s}</span>`).join("");
  $("#pos").textContent=`${S.screen+1} / ${SCREENS.length}`;
  $("#prev").disabled=S.screen===0; $("#next").disabled=S.screen===SCREENS.length-1; $("#next").classList.remove("pulse");
  $("#next").textContent = S.screen===0 ? "Začít →" : "Další →"; window.scrollTo(0,0); }
$("#prev").onclick=()=>show(S.screen-1); $("#next").onclick=()=>show(S.screen+1);
show(S.screen||0);
</script>
